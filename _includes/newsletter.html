<div class="newsletter-box">
  <h3>Ricevi ogni tanto qualche pensiero, niente spam</h3>
  <p>Una email ogni tanto, quando pubblico qualcosa di nuovo su Nomarin.</p>

  <form
    action="https://buttondown.email/api/emails/embed-subscribe/nomarin"
    method="post"
    target="popupwindow"
    onsubmit="window.open('https://buttondown.email/nomarin', 'popupwindow')"
    class="embeddable-buttondown-form"
  >
    <input type="email" name="email" placeholder="La tua email" required>
    <input type="submit" value="Iscriviti">
  </form>
</div>
